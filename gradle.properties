org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ------------------------------------------------------------------------------------------
# SALVACIBO - MONETIZZAZIONE
# ------------------------------------------------------------------------------------------
# Pubblicità (banner AdMob in fondo alla lista). Metti false per pubblicare senza annunci.
SALVACIBO_ADS_ENABLED=true
# Acquisti in-app ("Offrimi un caffè" che toglie le pubblicità + donazioni).
SALVACIBO_BILLING_ENABLED=true
# ID presi dal tuo account AdMob (https://admob.google.com). Se restano vuoti la versione
# release mostra annunci di PROVA (nessun guadagno). Formati:
#   ADMOB_APP_ID=ca-app-pub-1234567890123456~1234567890
#   ADMOB_BANNER_ID=ca-app-pub-1234567890123456/1234567890
ADMOB_APP_ID=
ADMOB_BANNER_ID=
